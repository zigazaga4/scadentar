[package]
name = "scadentar-wa"
version = "0.1.0"
description = "Conexiune WhatsApp (cod QR, mesaje către propriul număr) pentru Scadențar"
edition = "2021"

[dependencies]
whatsapp-rust = { version = "0.7", default-features = false, features = ["sqlite-storage", "tokio-transport", "tokio-runtime", "ureq-client", "tokio-native"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
log = "0.4"

[dev-dependencies]
serde_json = "1"
